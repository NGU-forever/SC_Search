[project]
name = "sc-search"
version = "0.1.0"
description = "Star Citizen local knowledge base (SQLite) with MCP tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Frank Xiong" }]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.1,<2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sc_search = ["ingest/schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
